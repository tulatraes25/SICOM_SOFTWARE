name: SICOM Two Stage Review QA

on:
  push:
    branches:
      - feat/two-stage-maintenance-monthly-review

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc -b --pretty false
      - name: Build
        run: npm run build
      - name: Diff sanity
        run: git diff --check HEAD^ HEAD

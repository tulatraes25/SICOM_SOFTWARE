name: Technical Sheet CI

on:
  push:
    branches:
      - feat/elevator-technical-sheet

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npx tsc -b --pretty false
      - name: Build
        run: npm run build
